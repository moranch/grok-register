services:
  warp:
    image: caomingjun/warp:latest
    restart: unless-stopped
    environment:
      WARP_SLEEP: 2
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:1080:1080"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    shm_size: 1gb
    depends_on:
      - warp

  statsig-signer:
    build:
      context: ./apps/statsig-signer
    restart: unless-stopped

  grok2api:
    image: ghcr.io/chenyme/grok2api:latest
    entrypoint: ["/bin/sh", "/opt/grok2api-volume-entrypoint.sh"]
    command: ["/app/grok2api", "--config", "/app/config.yaml", "--listen", "0.0.0.0:8000"]
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      SERVER_WORKERS: 1
      ACCOUNT_STORAGE: ${GROK2API_ACCOUNT_STORAGE:-local}
      ACCOUNT_LOCAL_PATH: ${GROK2API_ACCOUNT_LOCAL_PATH:-/app/data/accounts.db}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191}
      CF_REFRESH_INTERVAL: ${CF_REFRESH_INTERVAL:-600}
      CF_TIMEOUT: ${CF_TIMEOUT:-60}
      GROK_APP_APP_URL: ${GROK2API_APP_URL:-http://localhost:8000}
      GROK_APP_API_KEY: ${GROK2API_API_KEY:-}
    ports:
      - "${GROK2API_HOST_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /run/grok2api/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./apps/grok2api-runtime/volume-entrypoint.sh:/opt/grok2api-volume-entrypoint.sh:ro
      - ./runtime/grok2api/data:/app/data
      - ./runtime/grok2api/logs:/app/logs
    restart: unless-stopped
    depends_on:
      warp:
        condition: service_started
      flaresolverr:
        condition: service_started
      statsig-signer:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: apps/worker-runtime/Dockerfile
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    environment:
      TZ: Asia/Shanghai
      GROK_REGISTER_SOURCE_DIR: /workspace
      GROK_REGISTER_PYTHON: /usr/local/bin/python
      GROK_REGISTER_CONSOLE_HOST: 0.0.0.0
      GROK_REGISTER_CONSOLE_PORT: ${GROK_STACK_CONSOLE_PORT:-18600}
      GROK_REGISTER_CONSOLE_PASSWORD: ${GROK_STACK_CONSOLE_PASSWORD:-}
      GROK_REGISTER_CONSOLE_MAX_CONCURRENT_TASKS: 1
      GROK_REGISTER_DEFAULT_RUN_COUNT: ${GROK_REGISTER_DEFAULT_RUN_COUNT:-50}
      GROK_REGISTER_DEFAULT_PROXY: ${GROK_REGISTER_DEFAULT_PROXY:-socks5://warp:1080}
      GROK_REGISTER_DEFAULT_BROWSER_PROXY: ${GROK_REGISTER_DEFAULT_BROWSER_PROXY:-socks5://warp:1080}
      GROK_REGISTER_DEFAULT_API_ENDPOINT: ${GROK_REGISTER_DEFAULT_API_ENDPOINT:-http://grok2api:8000/admin/api/tokens/add}
      GROK_REGISTER_DEFAULT_API_TOKEN: ${GROK_REGISTER_DEFAULT_API_TOKEN:-change-this-admin-password}
      GROK_REGISTER_DEFAULT_API_APPEND: ${GROK_REGISTER_DEFAULT_API_APPEND:-true}
      GROK_REGISTER_CPA_AUTH_DIR: ${GROK_REGISTER_CPA_AUTH_DIR:-/workspace/runtime/cpa-auth}
      GROK_REGISTER_CPA_AUTO_MINT: ${GROK_REGISTER_CPA_AUTO_MINT:-1}
      GROK2API_ADMIN_USERNAME: ${GROK2API_ADMIN_USERNAME:-admin}
      GROK2API_ADMIN_PASSWORD: ${GROK2API_ADMIN_PASSWORD:-}
      GROK2API_INTERNAL_URL: http://grok2api:8000
      GROK2API_STATSIG_SIGNER_URL: http://statsig-signer:8788/sign
      GROK2API_CF_REFRESH_INTERVAL: ${GROK2API_CF_REFRESH_INTERVAL:-600}
      GROK2API_AUTO_SYNC_CONSOLE: ${GROK2API_AUTO_SYNC_CONSOLE:-1}
      GROK_REGISTER_DEFER_API_PUSH: "1"
      DOWNLOAD_GATE_INTERNAL_URL: http://download-gate:18787
      DOWNLOAD_GATE_INTERNAL_TOKEN: ${DOWNLOAD_GATE_INTERNAL_TOKEN:-}
      DOWNLOAD_GATE_PUBLIC_URL: ${DOWNLOAD_GATE_PUBLIC_URL:-http://localhost:18787}
      GROK_REGISTER_AUTO_REPLENISH_ENABLED: ${GROK_REGISTER_AUTO_REPLENISH_ENABLED:-1}
      GROK_REGISTER_AUTO_REPLENISH_THRESHOLD: ${GROK_REGISTER_AUTO_REPLENISH_THRESHOLD:-100}
      GROK_REGISTER_AUTO_REPLENISH_COUNT: ${GROK_REGISTER_AUTO_REPLENISH_COUNT:-100}
      GROK_REGISTER_AUTO_REPLENISH_CHECK_SECONDS: ${GROK_REGISTER_AUTO_REPLENISH_CHECK_SECONDS:-60}
      GROK_REGISTER_AUTO_REPLENISH_COOLDOWN_SECONDS: ${GROK_REGISTER_AUTO_REPLENISH_COOLDOWN_SECONDS:-300}
      # 启动时拉起 Xvfb + x11vnc + noVNC；0 可禁用
      GROK_ENABLE_NOVNC: ${GROK_ENABLE_NOVNC:-1}
    ports:
      - "${GROK_STACK_CONSOLE_PORT:-18600}:18600"
      # noVNC Web 端（访问 http://host:6080/vnc.html 可实时看调试模式下的浏览器）
      - "${GROK_STACK_NOVNC_PORT:-6080}:6080"
    volumes:
      - .:/workspace
    restart: unless-stopped
    depends_on:
      - grok2api
      - warp
      - download-gate
      - statsig-signer

  download-gate:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "/app/download_gate_server.py"]
    environment:
      TZ: Asia/Shanghai
      DOWNLOAD_GATE_HOST: 0.0.0.0
      DOWNLOAD_GATE_PORT: 18787
      DOWNLOAD_GATE_ADMIN_PATH: ${DOWNLOAD_GATE_ADMIN_PATH:-/dg-admin}
      DOWNLOAD_GATE_ADMIN_PASSWORD: ${DOWNLOAD_GATE_ADMIN_PASSWORD:-}
      DOWNLOAD_GATE_INTERNAL_TOKEN: ${DOWNLOAD_GATE_INTERNAL_TOKEN:-}
      DOWNLOAD_GATE_CONSOLE_URL: ${DOWNLOAD_GATE_CONSOLE_URL:-http://console:18600}
      DOWNLOAD_GATE_CONSOLE_TIMEOUT: ${DOWNLOAD_GATE_CONSOLE_TIMEOUT:-120}
    ports:
      - "${DOWNLOAD_GATE_BIND_HOST:-0.0.0.0}:${DOWNLOAD_GATE_HOST_PORT:-18787}:18787"
    volumes:
      - ./apps/download-gate/download_gate_server.py:/app/download_gate_server.py:ro
      - ./runtime/download-gate:/app/download_gate_data
    restart: unless-stopped
